<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Флора</title>
<meta name="description" content="Страница не найдена. Вернитесь в каталог цветов «Флора» или свяжитесь с нами.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Inter',sans-serif;background:#fdf8f3;color:#2b2b2b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
  .card{max-width:560px}

  h1{font-family:'Playfair Display',serif;font-size:30px;margin:-20px 0 16px;color:#c2185b}
  p{color:#666;margin-bottom:26px;font-size:16px;line-height:1.6}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:13px 26px;border-radius:30px;text-decoration:none;font-weight:600;font-size:14px}
  .btn-primary{background:linear-gradient(135deg,#e91e63,#c2185b);color:#fff;box-shadow:0 8px 20px rgba(233,30,99,.35)}
  .btn-ghost{background:#fff;color:#2b2b2b;border:2px solid #e5e5e5}

</style>
</head>
<body>

  <div class="btns">
    <a href="index.html" class="btn btn-primary">На главную</a>
    <a href="index.html#catalog" class="btn btn-ghost">В каталог</a>

  </div>
</div>
